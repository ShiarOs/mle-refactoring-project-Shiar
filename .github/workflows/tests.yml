name: Run tests to make Omar Happy

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest -v